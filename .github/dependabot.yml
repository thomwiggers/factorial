version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    rebase-strategy: "auto"
    reviewers:
      - "thomwiggers"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    rebase-strategy: "auto"
    reviewers:
      - "thomwiggers"
    groups:
      github-actions:
        patterns:
          - "*"
